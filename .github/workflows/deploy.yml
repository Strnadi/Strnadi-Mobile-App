name: Deploy Mobile Apps

on:
  push:
    branches:
      - main
      - release/**
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to deploy.
        required: true
        type: choice
        default: all
        options:
          - all
          - ios
          - android
      play_track:
        description: Google Play track, for example internal, alpha, beta, or a custom closed-testing track name.
        required: true
        type: string
        default: internal
      release_status:
        description: Google Play release status.
        required: true
        type: choice
        default: completed
        options:
          - completed
          - draft
          - inProgress
          - halted
      build_name:
        description: Optional version name override. Defaults to pubspec.yaml version before +.
        required: false
        type: string
      build_number:
        description: Optional build number override. Defaults to the GitHub run number.
        required: false
        type: string

concurrency:
  group: deploy-${{ github.ref }}-${{ github.event.inputs.platform || 'push' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUILD_NAME: ${{ github.event.inputs.build_name }}
  BUILD_NUMBER: ${{ github.event.inputs.build_number || github.run_number }}
  GOOGLE_PLAY_TRACK: ${{ github.event.inputs.play_track || (startsWith(github.ref_name, 'release/') && (vars.GOOGLE_PLAY_CLOSED_TRACK || 'alpha')) || 'internal' }}
  GOOGLE_PLAY_RELEASE_STATUS: ${{ github.event.inputs.release_status || 'completed' }}

jobs:
  deploy_android:
    name: Deploy Android to Play Console
    if: ${{ github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION || '3.41.2' }}
          channel: stable
          cache: true

      - name: Cache Flutter pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: android
          bundler-cache: true

      - name: Restore build environment file
        env:
          BUILD_ENV_JSON_BASE64: ${{ secrets.BUILD_ENV_JSON_BASE64 }}
        run: bash .github/scripts/restore-build-env.sh

      - name: Restore Android signing and Play credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: bash .github/scripts/restore-android-secrets.sh

      - name: Validate Android signing key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore android/upload-keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

      - name: Deploy Android App Bundle
        working-directory: android
        env:
          SUPPLY_JSON_KEY: ${{ github.workspace }}/android/play-store-service-account.json
        run: bundle exec fastlane play

      - name: Upload Android failure reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-failure-reports
          if-no-files-found: ignore
          path: |
            build/app/reports/**
            build/app/outputs/logs/**
            android/app/build/reports/**
            android/.gradle/**/problems-report.html

      - name: Comment Jira deployment
        if: ${{ success() }}
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL || 'https://strnadi-status.atlassian.net' }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEYS: ${{ vars.JIRA_PROJECT_KEYS || 'APP' }}
          BRANCH_NAME: ${{ github.ref_name }}
          JIRA_COMMENT_BODY: |
            Android build deployed from Strnadi-Mobile-App.

            Branch: ${{ github.ref_name }}
            Play track: ${{ env.GOOGLE_PLAY_TRACK }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/comment-jira.sh

  deploy_ios:
    name: Deploy iOS to TestFlight
    if: ${{ github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios' }}
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          xcode_app="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          if [[ -n "$xcode_app" ]]; then
            sudo xcode-select -s "$xcode_app/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION || '3.41.2' }}
          channel: stable
          cache: true

      - name: Cache Flutter pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: ios
          bundler-cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock', 'ios/Podfile', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: build/ios/DerivedData
          key: ${{ runner.os }}-xcode-deriveddata-${{ hashFiles('ios/Podfile.lock', 'ios/Runner.xcodeproj/project.pbxproj', 'ios/Runner.xcworkspace/contents.xcworkspacedata', 'pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-xcode-deriveddata-${{ hashFiles('ios/Podfile.lock', 'ios/Runner.xcodeproj/project.pbxproj', 'ios/Runner.xcworkspace/contents.xcworkspacedata', 'pubspec.lock') }}-
            ${{ runner.os }}-xcode-deriveddata-

      - name: Restore build environment file
        env:
          BUILD_ENV_JSON_BASE64: ${{ secrets.BUILD_ENV_JSON_BASE64 }}
        run: bash .github/scripts/restore-build-env.sh

      - name: Restore iOS manual signing assets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APPSTORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: bash .github/scripts/restore-ios-signing.sh

      - name: Verify CocoaPods
        working-directory: ios
        run: bundle exec pod --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install iOS Pods
        working-directory: ios
        run: bundle exec pod install

      - name: Deploy iOS build to TestFlight
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID || '3GPTVJHVFN' }}
        run: |
          mkdir -p ../build/ios
          set -o pipefail
          bundle exec fastlane testflight --verbose 2>&1 | tee ../build/ios/fastlane-testflight.log

      - name: Upload iOS failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-failure-logs
          if-no-files-found: ignore
          path: |
            build/ios/fastlane-testflight.log
            build/ios/gym-logs/**
            build/ios/gym-result.xcresult/**
            ios/build/ios/gym-logs/**
            ios/build/ios/gym-result.xcresult/**
            /Users/runner/Library/Logs/gym/**

      - name: Comment Jira deployment
        if: ${{ success() }}
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL || 'https://strnadi-status.atlassian.net' }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEYS: ${{ vars.JIRA_PROJECT_KEYS || 'APP' }}
          BRANCH_NAME: ${{ github.ref_name }}
          JIRA_COMMENT_BODY: |
            iOS build deployed to TestFlight from Strnadi-Mobile-App.

            Branch: ${{ github.ref_name }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/comment-jira.sh
